name: Failure Catalog (released)

env:
  CLRSIG_VERSION: v0.13.2 # bump manually on each clrsig release; see docs/TASKS.md §7.2

on:
  push:
  schedule:
    - cron: "0 6 * * *"  # nightly against the pinned released build

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one failure does not cancel the rest
      matrix:
        fm:
          - { dir: "fm-001-01-number-precision",           port: 19001, kind: "server" }
          - { dir: "fm-001-02-datetime-format",            port: 19002, kind: "server" }
          - { dir: "fm-002-01-timeout-outcome",            port: 19082, kind: "server" }
          - { dir: "fm-003-01-pagination-contract",        port: 19003, kind: "server" }
          - { dir: "fm-003-02-page-overflow",              port: 19031, kind: "server" }
          - { dir: "fm-003-03-page-offset",                port: 19012, kind: "server" }
          - { dir: "fm-003-04-missing-pagination-meta",    port: 19049, kind: "server" }
          - { dir: "fm-004-01-renamed-removed-field",                   kind: "diff"   }
          - { dir: "fm-004-02-field-name-casing",          port: 19009, kind: "server" }
          - { dir: "fm-005-01-nullable-required",          port: 19005, kind: "server" }
          - { dir: "fm-005-02-null-collection",            port: 19023, kind: "server" }
          - { dir: "fm-005-03-nested-required",            port: 19032, kind: "server" }
          - { dir: "fm-005-04-default-not-applied",        port: 19019, kind: "server" }
          - { dir: "fm-006-01-old-client-compatibility",   port: 19079, kind: "server" }
          - { dir: "fm-007-01-version-routing",            port: 19024, kind: "server" }
          - { dir: "fm-008-01-token-validation",           port: 19078, kind: "server" }
          - { dir: "fm-010-01-spec-drift",                 port: 19010, kind: "server" }
          - { dir: "fm-010-02-error-schema",               port: 19006, kind: "server" }
          - { dir: "fm-010-03-bare-array",                 port: 19008, kind: "server" }
          - { dir: "fm-010-04-object-as-string",           port: 19021, kind: "server" }
          - { dir: "fm-010-05-boolean-type",               port: 19029, kind: "server" }
          - { dir: "fm-010-06-array-item-type",            port: 19015, kind: "server" }
          - { dir: "fm-010-07-minimum-value",              port: 19041, kind: "server" }
          - { dir: "fm-013-01-undocumented-dependency",    port: 19084, kind: "server" }
          - { dir: "fm-014-01-dst-schedule",               port: 19080, kind: "server" }
          - { dir: "fm-015-01-deprecation-lifecycle",      port: 19060, kind: "server" }
          - { dir: "fm-016-01-rate-limit",                 port: 19016, kind: "server" }
          - { dir: "fm-017-01-stale-read",                 port: 19017, kind: "server" }
          - { dir: "fm-018-01-idempotency",                port: 19018, kind: "server" }
          - { dir: "fm-018-02-duplicate-create",           port: 19042, kind: "server" }
          - { dir: "fm-019-01-webhook-processing",         port: 19070, kind: "server" }
          - { dir: "fm-020-01-batch-atomicity",            port: 19020, kind: "server" }
          - { dir: "fm-021-01-upload-processing",          port: 19071, kind: "server" }
          - { dir: "fm-022-01-semantically-invalid",       port: 19022, kind: "server" }
          - { dir: "fm-022-02-filter-ignored",             port: 19028, kind: "server" }
          - { dir: "fm-022-03-enum-violation",             port: 19030, kind: "server" }
          - { dir: "fm-022-04-sort-order",                 port: 19035, kind: "server" }
          - { dir: "fm-022-05-limit-ignored",              port: 19040, kind: "server" }
          - { dir: "fm-022-06-case-insensitive-enum",      port: 19037, kind: "server" }
          - { dir: "fm-022-07-empty-string-accepted",      port: 19045, kind: "server" }
          - { dir: "fm-022-08-conditional-required",       port: 19047, kind: "server" }
          - { dir: "fm-022-09-id-mismatch",                port: 19013, kind: "server" }
          - { dir: "fm-023-01-object-level-authz",          port: 19051, kind: "server" }
          - { dir: "fm-024-01-localized-values",           port: 19061, kind: "server" }
          - { dir: "fm-025-01-incorrect-status",           port: 19025, kind: "server" }
          - { dir: "fm-025-02-auth-error-code",            port: 19007, kind: "server" }
          - { dir: "fm-025-03-redirect-instead-of-response", port: 19011, kind: "server" }
          - { dir: "fm-025-04-validation-error-code",      port: 19043, kind: "server" }
          - { dir: "fm-025-05-empty-result-404",           port: 19048, kind: "server" }
          - { dir: "fm-025-06-page-out-of-range-500",      port: 19050, kind: "server" }
          - { dir: "fm-026-01-content-negotiation",        port: 19062, kind: "server" }
          - { dir: "fm-027-01-lost-update",                port: 19027, kind: "server" }
          - { dir: "fm-028-01-async-job",                  port: 19026, kind: "server" }
          - { dir: "fm-029-01-bulk-partial-success",       port: 19053, kind: "server" }
          - { dir: "fm-030-01-key-rotation",               port: 19069, kind: "server" }
          - { dir: "fm-031-01-cors-preflight",             port: 19054, kind: "server" }
          - { dir: "fm-032-01-tls-certificate",            port: 19076, kind: "server" }
          - { dir: "fm-033-01-gateway-drift",              port: 19075, kind: "server" }
          - { dir: "fm-034-01-method-semantics",           port: 19034, kind: "server" }
          - { dir: "fm-034-02-method-not-allowed",         port: 19014, kind: "server" }
          - { dir: "fm-034-03-nonidempotent-get",          port: 19033, kind: "server" }
          - { dir: "fm-034-04-patch-semantics",            port: 19038, kind: "server" }
          - { dir: "fm-034-05-soft-delete",                port: 19036, kind: "server" }
          - { dir: "fm-034-06-bulk-delete",                port: 19039, kind: "server" }
          - { dir: "fm-035-01-request-headers",             port: 19059, kind: "server" }
          - { dir: "fm-036-01-request-limits",             port: 19063, kind: "server" }
          - { dir: "fm-037-01-query-injection",            port: 19064, kind: "server" }
          - { dir: "fm-038-01-write-not-persisted",        port: 19046, kind: "server" }
          - { dir: "fm-039-01-out-of-order-events",        port: 19065, kind: "server" }
          - { dir: "fm-040-01-partial-write",              port: 19067, kind: "server" }
          - { dir: "fm-041-01-retry-storm",                port: 19068, kind: "server" }
          - { dir: "fm-042-01-fault-isolation",            port: 19066, kind: "server" }
          - { dir: "fm-043-01-mass-assignment",            port: 19052, kind: "server" }
          - { dir: "fm-044-01-sensitive-data",             port: 19044, kind: "server" }
          - { dir: "fm-045-01-trusted-identity-headers",   port: 19056, kind: "server" }
          - { dir: "fm-046-01-secret-leakage",             port: 19058, kind: "server" }
          - { dir: "fm-047-01-unicode-round-trip",         port: 19055, kind: "server" }
          - { dir: "fm-048-01-streaming-completion",       port: 19083, kind: "server" }
          - { dir: "fm-049-01-documentation-drift",        port: 19081, kind: "server" }
          - { dir: "fm-050-01-flag-drift",                 port: 19073, kind: "server" }
          # Add entries here as sub-projects land — see docs/TASKS.md §7.4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # A release download has failed with a 403 and then worked on a rerun.
      # --retry alone doesn't retry a 403, so --retry-all-errors is needed.
      - name: Install clrsig
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors \
            https://github.com/fuvito/api-workbench/releases/download/${{ env.CLRSIG_VERSION }}/clrsig-linux-amd64 \
            -o /usr/local/bin/clrsig && chmod +x /usr/local/bin/clrsig

      # Optional per-example settings for clrsig, such as a test CA (fm-032)
      - name: Load per-example settings
        run: |
          if [ -f failures/${{ matrix.fm.dir }}/ci.env ]; then
            cat failures/${{ matrix.fm.dir }}/ci.env >> "$GITHUB_ENV"
          fi

      # Server-based: compile first to avoid cold-compile race, then poll for readiness
      - name: Build and start broken server
        if: matrix.fm.kind == 'server'
        timeout-minutes: 2
        run: |
          go build -o /tmp/server-broken \
            ./failures/${{ matrix.fm.dir }}/broken/
          /tmp/server-broken &
          for i in $(seq 1 50); do
            curl -sf http://localhost:${{ matrix.fm.port }}/health && break
            [ $i -eq 50 ] && { echo "Server did not become ready after 10s"; exit 1; }
            sleep 0.2
          done

      - name: "Detect (must exit 1)"
        if: matrix.fm.kind == 'server'
        run: |
          set +e
          clrsig run failures/${{ matrix.fm.dir }}/scenarios/detect.yaml \
            --env failures/${{ matrix.fm.dir }}/environments/local.yaml
          EXIT=$?
          if [ $EXIT -ne 1 ]; then
            echo "DETECTION FAILED: expected clrsig to exit 1 (broken server should trigger assertions), got exit $EXIT"
            echo "The broken server passed all assertions — the scenario does not catch the bug."
            exit 1
          fi

      - name: Stop broken server
        if: matrix.fm.kind == 'server'
        run: pkill -f server-broken || true

      - name: Build and start fixed server
        if: matrix.fm.kind == 'server'
        timeout-minutes: 2
        run: |
          go build -o /tmp/server-fixed \
            ./failures/${{ matrix.fm.dir }}/fixed/
          /tmp/server-fixed &
          for i in $(seq 1 50); do
            curl -sf http://localhost:${{ matrix.fm.port }}/health && break
            [ $i -eq 50 ] && { echo "Server did not become ready after 10s"; exit 1; }
            sleep 0.2
          done

      - name: "Fix (must exit 0)"
        if: matrix.fm.kind == 'server'
        run: |
          clrsig run failures/${{ matrix.fm.dir }}/scenarios/detect.yaml \
            --env failures/${{ matrix.fm.dir }}/environments/local.yaml

      # Diff-based: no server needed
      - name: "Diff (must exit 1)"
        if: matrix.fm.kind == 'diff'
        run: |
          set +e
          clrsig diff \
            failures/${{ matrix.fm.dir }}/v1/openapi.yaml \
            failures/${{ matrix.fm.dir }}/v2/openapi.yaml \
            --breaking-only
          EXIT=$?
          if [ $EXIT -ne 1 ]; then
            echo "DETECTION FAILED: expected clrsig diff to exit 1 (breaking changes should be detected), got exit $EXIT"
            echo "No breaking changes were reported — the specs may not encode the intended breaking change."
            exit 1
          fi
