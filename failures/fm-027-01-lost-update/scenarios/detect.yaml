schemaVersion: "1"
title: fm-027-01 — Concurrent Update and Lost-Update Failures
steps:
  - label: "read item — confirm starting version is 1"
    request:
      method: GET
      url: "{{baseUrl}}/items/1"
    assertions:
      - type: jsonpath
        path: $.version
        operator: eq
        expected: 1

  - label: "first write — update with version=1 (must succeed)"
    request:
      method: PUT
      url: "{{baseUrl}}/items/1"
      body:
        type: json
        content: '{"value":20,"version":1}'
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "stale write — update again with the original version=1 (must be rejected with 409)"
    request:
      method: PUT
      url: "{{baseUrl}}/items/1"
      body:
        type: json
        content: '{"value":99,"version":1}'
    assertions:
      - type: status
        operator: eq
        expected: 409
