schemaVersion: "1"
title: fm-034-05 — Soft Delete Becomes Hard Delete
steps:
  - label: "DELETE /items/1 — must return 200 with body (broken server returns 204)"
    request:
      method: DELETE
      url: "{{baseUrl}}/items/1"
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "GET /items/1 after soft-delete — record must still exist (broken server 404s)"
    request:
      method: GET
      url: "{{baseUrl}}/items/1"
    assertions:
      - type: status
        operator: eq
        expected: 200
