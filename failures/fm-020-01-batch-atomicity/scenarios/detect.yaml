schemaVersion: "1"
title: fm-020-01 — Batch Operation Atomicity
steps:
  - label: "batch with one invalid item (empty name) must be rejected with 422"
    failPolicy: continue
    request:
      method: POST
      url: "{{baseUrl}}/items/batch"
      body:
        type: json
        content: '{"items":[{"name":"Widget"},{"name":""},{"name":"Gadget"}]}'
    assertions:
      - type: status
        operator: eq
        expected: 422

  - label: "after rejected batch — no items must have been created (count = 0)"
    request:
      method: GET
      url: "{{baseUrl}}/items"
    assertions:
      - type: jsonpath
        path: "$.count"
        operator: eq
        expected: 0
