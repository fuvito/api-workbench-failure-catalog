openapi: "3.0.3"
info:
  title: Invoice API
  version: "1.0.0"
paths:
  /invoices/{id}:
    get:
      operationId: getInvoice
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid invoice ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Invoice:
      type: object
      required: [id, customer, subtotal, tax, total]
      properties:
        id:
          type: integer
        customer:
          type: string
        subtotal:
          type: number
          format: float
          description: Pre-tax amount in USD
        tax:
          type: number
          format: float
          description: Tax amount in USD
        total:
          type: number
          format: float
          description: Total amount in USD (subtotal + tax)
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
