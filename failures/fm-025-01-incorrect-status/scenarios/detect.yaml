schemaVersion: "1"
title: fm-025-01 — Incorrect HTTP Status and Business-Error Semantics
steps:
  - label: "existing product returns 200"
    request:
      method: GET
      url: "{{baseUrl}}/products/1"
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "missing product must return 404"
    request:
      method: GET
      url: "{{baseUrl}}/products/9999"
    assertions:
      - type: status
        operator: eq
        expected: 404
