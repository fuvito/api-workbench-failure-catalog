openapi: "3.0.3"
info:
  title: FM-029 Boolean Field Type Confusion
  version: "1.0.0"
paths:
  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /features:
    get:
      summary: List feature flags
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
components:
  schemas:
    User:
      type: object
      required: [id, name, active, email_verified]
      properties:
        id:
          type: integer
        name:
          type: string
        active:
          type: boolean
        email_verified:
          type: boolean
    FeatureFlags:
      type: object
      required: [dark_mode, beta_features, maintenance_mode]
      properties:
        dark_mode:
          type: boolean
        beta_features:
          type: boolean
        maintenance_mode:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
