openapi: "3.0.3"
info:
  title: Item Catalog API
  version: "1.0.0"
paths:
  /items/{id}:
    get:
      operationId: getItem
      summary: Get an item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Item:
      type: object
      required: [id, name, category, in_stock]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        in_stock:
          type: boolean
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
