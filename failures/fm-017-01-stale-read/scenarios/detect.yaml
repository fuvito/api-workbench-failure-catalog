schemaVersion: "1"
title: fm-017-01 — Stale Read After Write
steps:
  - label: "GET /items/1 — prime the cache on the broken server"
    request:
      method: GET
      url: "{{baseUrl}}/items/1"
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "PUT /items/1 to rename to Updated — must return 200"
    request:
      method: PUT
      url: "{{baseUrl}}/items/1"
      body:
        type: json
        content: '{"name":"Updated"}'
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "GET /items/1 again — must reflect the write (broken server returns stale cached name)"
    request:
      method: GET
      url: "{{baseUrl}}/items/1"
    assertions:
      - type: jsonpath
        path: "$.name"
        operator: eq
        expected: "Updated"
