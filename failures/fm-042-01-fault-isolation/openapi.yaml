openapi: "3.0.3"
info:
  title: FM-042 Fault Isolation
  description: >
    Recommendations are optional. When their service is down or slow, the order
    is still returned quickly, with an empty list and degraded set to true. The
    recommendations endpoint returns 503.
  version: "1.0.0"
paths:
  /orders/ord-1001:
    get:
      operationId: getOrder
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                required: [id, total, recommendations, degraded]
                properties:
                  id: {type: string}
                  total: {type: number}
                  recommendations: {type: array, items: {type: string}}
                  degraded: {type: boolean}
  /orders/ord-1001/recommendations:
    get:
      operationId: getRecommendations
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                required: [recommendations]
                properties:
                  recommendations: {type: array, items: {type: string}}
        "503":
          description: The recommendation service is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
  /test/recommendation-service:
    put:
      operationId: setDependencyState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [up, down, slow]}
      responses:
        "204":
          description: State changed
