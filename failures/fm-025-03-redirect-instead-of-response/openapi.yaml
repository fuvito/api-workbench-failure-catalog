openapi: "3.0.3"
info:
  title: FM-011 Redirect Instead of Response
  version: "1.0.0"
paths:
  /posts/{id}:
    get:
      summary: Get post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Post:
      type: object
      required: [id, title, body]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
