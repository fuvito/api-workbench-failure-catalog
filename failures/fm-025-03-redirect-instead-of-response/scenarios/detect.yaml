schemaVersion: "1"
title: fm-025-03 — Redirect Instead of Response
specFile: ../openapi.yaml
steps:
  - label: "GET /posts/1 — must return 200 with post, not 301 redirect"
    request:
      method: GET
      url: "{{baseUrl}}/posts/1"
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "GET /posts/2 — must return 200 with post, not 301 redirect"
    request:
      method: GET
      url: "{{baseUrl}}/posts/2"
    assertions:
      - type: status
        operator: eq
        expected: 200
