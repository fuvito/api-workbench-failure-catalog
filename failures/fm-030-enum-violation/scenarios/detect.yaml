schemaVersion: "1"
title: FM-030 — Enum Value Violation
specFile: ../openapi.yaml
steps:
  - label: "order 1 — status must be one of [pending, processing, completed, cancelled]"
    request:
      method: GET
      url: "{{baseUrl}}/orders/1"
    assertions: []

  - label: "order 2 — status 'SHIPPED' is not a declared enum value"
    request:
      method: GET
      url: "{{baseUrl}}/orders/2"
    assertions: []

  - label: "order 3 — priority must be one of [low, medium, high] (lowercase)"
    request:
      method: GET
      url: "{{baseUrl}}/orders/3"
    assertions: []
