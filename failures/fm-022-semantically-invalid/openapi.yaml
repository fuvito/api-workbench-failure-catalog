openapi: "3.0.3"
info:
  title: Order API
  version: "1.0.0"
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Order:
      type: object
      required: [id, customer, item, quantity, unit_price, total]
      properties:
        id:
          type: integer
        customer:
          type: string
        item:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          format: float
        total:
          type: number
          format: float
          description: Must equal unit_price * quantity
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
