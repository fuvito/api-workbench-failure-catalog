schemaVersion: "1"
title: FM-022 — Syntactically Valid but Semantically Invalid Payloads
steps:
  - label: "order 1: total must equal unit_price x quantity (3 x 10.00 = 30.00)"
    request:
      method: GET
      url: "{{baseUrl}}/orders/1"
    assertions:
      - type: jsonpath
        path: $.total
        operator: eq
        expected: 30.00

  - label: "order 2: total must equal unit_price x quantity (2 x 24.99 = 49.98)"
    request:
      method: GET
      url: "{{baseUrl}}/orders/2"
    assertions:
      - type: jsonpath
        path: $.total
        operator: eq
        expected: 49.98
