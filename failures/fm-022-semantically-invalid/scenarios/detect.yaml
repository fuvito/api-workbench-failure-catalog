name: FM-022 — Syntactically Valid but Semantically Invalid Payloads
steps:
  - name: "order 1: total must equal unit_price × quantity (3 × 10.00 = 30.00)"
    request:
      method: GET
      path: /orders/1
    assertions:
      - type: jsonpath
        path: $.total
        expected: 30.00

  - name: "order 2: total must equal unit_price × quantity (2 × 24.99 = 49.98)"
    request:
      method: GET
      path: /orders/2
    assertions:
      - type: jsonpath
        path: $.total
        expected: 49.98
