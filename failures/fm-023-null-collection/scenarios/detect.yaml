schemaVersion: "1"
title: FM-023 — Empty Collection vs Null
specFile: ../openapi.yaml
steps:
  - label: "team 1 — has members, response shape must be valid"
    request:
      method: GET
      url: "{{baseUrl}}/teams/1/members"
    assertions: []

  - label: "team 2 — empty team, members must be [] not null"
    request:
      method: GET
      url: "{{baseUrl}}/teams/2/members"
    assertions: []

  - label: "project 1 — has tags, response shape must be valid"
    request:
      method: GET
      url: "{{baseUrl}}/projects/1/tags"
    assertions: []

  - label: "project 2 — no tags, tags must be [] not null"
    request:
      method: GET
      url: "{{baseUrl}}/projects/2/tags"
    assertions: []
