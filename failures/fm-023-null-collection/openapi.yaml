openapi: "3.0.3"
info:
  title: FM-023 Empty Collection vs Null
  version: "1.0.0"
paths:
  /teams/{id}/members:
    get:
      summary: List members of a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/tags:
    get:
      summary: List tags on a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    Member:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
