openapi: "3.0.3"
info:
  title: FM-040 Limit Parameter Ignored
  version: "1.0.0"
paths:
  /items:
    get:
      summary: List items with optional limit
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Item list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
components:
  schemas:
    ItemList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        count:
          type: integer
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
