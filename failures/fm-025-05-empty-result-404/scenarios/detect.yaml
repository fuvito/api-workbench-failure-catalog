schemaVersion: "1"
title: fm-025-05 — Empty Result Set Returns 404
steps:
  - label: "GET /users?role=admin — known role, must return 200"
    request:
      method: GET
      url: "{{baseUrl}}/users?role=admin"
    assertions:
      - type: status
        operator: eq
        expected: 200

  - label: "GET /users?role=unknown — no matches, must return 200 with empty list (broken returns 404)"
    request:
      method: GET
      url: "{{baseUrl}}/users?role=unknown"
    assertions:
      - type: status
        operator: eq
        expected: 200
