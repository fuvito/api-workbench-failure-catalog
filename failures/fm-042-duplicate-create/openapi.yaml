openapi: "3.0.3"
info:
  title: FM-042 Duplicate Create Returns 200 Instead of 409
  version: "1.0.0"
paths:
  /users:
    post:
      summary: Create a new user (email must be unique)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
