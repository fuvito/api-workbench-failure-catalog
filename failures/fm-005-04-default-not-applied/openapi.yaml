openapi: "3.0.3"
info:
  title: FM-019 Default Value Not Applied
  version: "1.0.0"
paths:
  /posts:
    post:
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                published:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
components:
  schemas:
    Post:
      type: object
      required: [id, title, published]
      properties:
        id:
          type: integer
        title:
          type: string
        published:
          type: boolean
          default: false
