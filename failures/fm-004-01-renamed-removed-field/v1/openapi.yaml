openapi: "3.0.3"
info:
  title: User API
  version: "1.0.0"
paths:
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    User:
      type: object
      required: [id, full_name, email, phone]
      properties:
        id:
          type: integer
        full_name:
          type: string
          description: User's full display name
        email:
          type: string
          format: email
        phone:
          type: string
          description: Primary contact phone number
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
