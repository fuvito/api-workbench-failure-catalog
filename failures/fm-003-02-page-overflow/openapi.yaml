openapi: "3.0.3"
info:
  title: FM-031 Page Overflow Returns Wrong Data
  version: "1.0.0"
paths:
  /items:
    get:
      summary: List items with pagination
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Items page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
components:
  schemas:
    ItemPage:
      type: object
      required: [items, count, page, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        count:
          type: integer
        page:
          type: integer
        total_pages:
          type: integer
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
