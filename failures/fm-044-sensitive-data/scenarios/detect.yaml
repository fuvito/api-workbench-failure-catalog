schemaVersion: "1"
title: FM-044 — Sensitive Data Exposure in API Responses
specFile: ./openapi.yaml
steps:
  - label: "user 1 response must not include undeclared fields (password_hash, api_key, role)"
    request:
      method: GET
      url: "{{baseUrl}}/users/1"
    assertions:
      - type: schema

  - label: "user 2 response must not include undeclared fields (password_hash, api_key, role)"
    request:
      method: GET
      url: "{{baseUrl}}/users/2"
    assertions:
      - type: schema
