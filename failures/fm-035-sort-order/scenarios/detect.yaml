schemaVersion: "1"
title: FM-035 — Sort Order Contract
specFile: ../openapi.yaml
steps:
  - label: "sort=price_asc — first item must have the lowest price (29.99)"
    request:
      method: GET
      url: "{{baseUrl}}/products?sort=price_asc"
    assertions:
      - type: jsonpath
        path: "$.items[0].price"
        operator: eq
        expected: 29.99

  - label: "sort=price_desc — first item must have the highest price (349.99)"
    request:
      method: GET
      url: "{{baseUrl}}/products?sort=price_desc"
    assertions:
      - type: jsonpath
        path: "$.items[0].price"
        operator: eq
        expected: 349.99
