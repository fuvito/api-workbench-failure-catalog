schemaVersion: "1"
title: FM-034 — HTTP Method and Operation Semantics Failures
steps:
  - label: "POST /articles must return 201 Created (spec declares 201, broken returns 200)"
    request:
      method: POST
      url: "{{baseUrl}}/articles"
      body:
        type: json
        content: '{"title":"Hello World","author":"Alice"}'
    assertions:
      - type: status
        operator: eq
        expected: 201

  - label: "DELETE /articles/1 must return 204 No Content (spec declares 204, broken returns 200)"
    request:
      method: DELETE
      url: "{{baseUrl}}/articles/1"
    assertions:
      - type: status
        operator: eq
        expected: 204
