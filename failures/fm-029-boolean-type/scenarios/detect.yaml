schemaVersion: "1"
title: FM-029 — Boolean Field Type Confusion
specFile: ../openapi.yaml
steps:
  - label: "user 1 — active and email_verified must be booleans, not strings"
    request:
      method: GET
      url: "{{baseUrl}}/users/1"
    assertions: []

  - label: "user 2 — active:false must be boolean false, not string \"false\""
    request:
      method: GET
      url: "{{baseUrl}}/users/2"
    assertions: []

  - label: "feature flags — all flags must be booleans, not integers 1/0"
    request:
      method: GET
      url: "{{baseUrl}}/features"
    assertions: []
