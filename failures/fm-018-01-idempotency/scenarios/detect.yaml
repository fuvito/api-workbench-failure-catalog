schemaVersion: "1"
title: fm-018-01 — Idempotency and Duplicate-Operation Failures
steps:
  - label: "submit payment for order-42"
    request:
      method: POST
      url: "{{baseUrl}}/payments"
      body:
        type: json
        content: '{"order_id":"order-42","amount":99.99,"currency":"USD"}'
    assertions:
      - type: status
        operator: eq
        expected: 201

  - label: "retry: same payment for order-42 (simulates network retry)"
    request:
      method: POST
      url: "{{baseUrl}}/payments"
      body:
        type: json
        content: '{"order_id":"order-42","amount":99.99,"currency":"USD"}'
    assertions:
      - type: jsonpath
        path: $.order_id
        operator: eq
        expected: "order-42"

  - label: "only one payment must exist — count of 2 means the retry was processed as a duplicate charge"
    request:
      method: GET
      url: "{{baseUrl}}/payments"
    assertions:
      - type: jsonpath
        path: $.count
        operator: eq
        expected: 1
