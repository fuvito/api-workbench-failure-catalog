openapi: "3.0.3"
info:
  title: FM-012 Off-by-One in Page Offset
  version: "1.0.0"
paths:
  /items:
    get:
      summary: List items with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated item list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
components:
  schemas:
    ItemPage:
      type: object
      required: [items, count, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    Item:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
