schemaVersion: "1"
title: fm-014-01 — Daylight-Saving Schedule
description: "Previews daily schedules across the 2026 and 2027 clock changes in two time zones. The dates are fixed, so results don't depend on today."
specFile: ../openapi.yaml
steps:
  - label: "Control: an ordinary week in New York"
    request: {method: GET, url: "{{baseUrl}}/schedule/preview?timezone=America/New_York&time=09:00&from=2026-06-01&days=2"}
    assertions:
      - {type: jsonpath, path: "$.runs[0]", operator: eq, expected: "2026-06-01T09:00:00-04:00"}
      - {type: jsonpath, path: "$.runs[1]", operator: eq, expected: "2026-06-02T09:00:00-04:00"}
    failPolicy: continue

  - label: "09:00 stays 09:00 when clocks go forward"
    request: {method: GET, url: "{{baseUrl}}/schedule/preview?timezone=America/New_York&time=09:00&from=2027-03-13&days=2"}
    assertions:
      - {type: jsonpath, path: "$.runs[0]", operator: eq, expected: "2027-03-13T09:00:00-05:00"}
      - {type: jsonpath, path: "$.runs[1]", operator: eq, expected: "2027-03-14T09:00:00-04:00"}
    failPolicy: continue

  - label: "09:00 stays 09:00 when European clocks go back"
    request: {method: GET, url: "{{baseUrl}}/schedule/preview?timezone=Europe/Berlin&time=09:00&from=2026-10-24&days=2"}
    assertions:
      - {type: jsonpath, path: "$.runs[0]", operator: eq, expected: "2026-10-24T09:00:00+02:00"}
      - {type: jsonpath, path: "$.runs[1]", operator: eq, expected: "2026-10-25T09:00:00+01:00"}
    failPolicy: continue

  - label: "A repeated time runs at its first occurrence"
    notes: "01:30 happens twice on 2026-11-01 in New York."
    request: {method: GET, url: "{{baseUrl}}/schedule/preview?timezone=America/New_York&time=01:30&from=2026-11-01&days=2"}
    assertions:
      - {type: jsonpath, path: "$.runs[0]", operator: eq, expected: "2026-11-01T01:30:00-04:00"}
      - {type: jsonpath, path: "$.runs[1]", operator: eq, expected: "2026-11-02T01:30:00-05:00"}
    failPolicy: continue

  - label: "A skipped time runs after the clocks move"
    notes: "02:30 doesn't exist on 2027-03-14 in New York."
    request: {method: GET, url: "{{baseUrl}}/schedule/preview?timezone=America/New_York&time=02:30&from=2027-03-14&days=2"}
    assertions:
      - {type: jsonpath, path: "$.runs[0]", operator: eq, expected: "2027-03-14T03:30:00-04:00"}
      - {type: jsonpath, path: "$.runs[1]", operator: eq, expected: "2027-03-15T02:30:00-04:00"}
    failPolicy: continue
