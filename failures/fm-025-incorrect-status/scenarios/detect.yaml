name: FM-025 — Incorrect HTTP Status and Business-Error Semantics
steps:
  - name: existing product returns 200
    request:
      method: GET
      path: /products/1
    assertions:
      - type: status
        expected: 200

  - name: missing product must return 404
    request:
      method: GET
      path: /products/9999
    assertions:
      - type: status
        expected: 404
