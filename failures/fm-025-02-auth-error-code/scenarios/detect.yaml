schemaVersion: "1"
title: fm-025-02 — Authentication Error Code Confusion
specFile: ../openapi.yaml
steps:
  - label: "POST /login with wrong password — must return 401, not 200"
    request:
      method: POST
      url: "{{baseUrl}}/login"
      body:
        type: json
        content: '{"username":"alice","password":"wrong"}'
    assertions:
      - type: status
        operator: eq
        expected: 401

  - label: "GET /profile without token — must return 401, not 200"
    request:
      method: GET
      url: "{{baseUrl}}/profile"
    assertions:
      - type: status
        operator: eq
        expected: 401
