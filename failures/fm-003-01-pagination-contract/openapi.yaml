openapi: "3.0.3"
info:
  title: Product Catalog API
  version: "1.0.0"
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products with page-based pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          format: float
    ProductPage:
      type: object
      required: [items, total, page, limit, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          description: Total number of products across all pages
        page:
          type: integer
          description: Current page number (1-indexed)
        limit:
          type: integer
          description: Maximum items per page
        has_more:
          type: boolean
          description: True if there are additional pages after this one
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
