openapi: "3.0.3"
info:
  title: Article API
  version: "1.0.0"
paths:
  /articles:
    post:
      operationId: createArticle
      summary: Create a new article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article created
          headers:
            Location:
              description: URL of the created article
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /articles/{id}:
    get:
      operationId: getArticle
      summary: Get an article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteArticle
      summary: Delete an article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Article deleted — no content
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ArticleInput:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
        author:
          type: string
    Article:
      type: object
      required: [id, title, author]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
